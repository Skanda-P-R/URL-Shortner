version: '3.8'

services:
  web:
    build: .
    container_name: url_shortener_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=URL Shortener API
      - DEBUG=true
      - BASE_URL=http://localhost:8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/urlshortener
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=86400
      - ALLOWED_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: url_shortener_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
